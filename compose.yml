services:
  nats:
    image: nats:latest
    container_name: nats
    command: ["-js"]
    volumes:
      - /mnt/owncloud-data/nats:/data
    logging:
      driver: ${LOG_DRIVER:-local}
    restart: always
  tika:
    image: apache/tika:latest-full
    container_name: tika
    restart: always
    logging:
      driver: local
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9998/version"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
  ocis:
    container_name: ocis
    image: owncloud/ocis
    user: "1000:1000"
    ports:
      - "9200:9200"
    environment:
      - OCIS_LOG_LEVEL=error
      - IDM_CREATE_DEMO_USERS=false
      - DIM_DOMAIN=boterop.com
      - PROXY_HTTP_ADDR=0.0.0.0:9200
      - OCIS_URL=https://drive.boterop.com
      - OCIS_INSECURE=true

      - OCIS_EXCLUDE_RUN_SERVICES=nats
      - OCIS_EVENTS_ENDPOINT=nats:4222
      - OCIS_EVENTS_CLUSTER=ocis-cluster
      - OCIS_EVENTS_ENABLE_TLS=false
      - MICRO_REGISTRY=nats-js-kv
      - MICRO_REGISTRY_ADDRESS=nats:4222
      - OCIS_PERSISTENT_STORE_NODES=nats:4222
      - OCIS_CACHE_STORE_NODES=nats:4222
      - NATS_NATS_HOST=nats
      - NATS_NATS_PORT=4222

      - SEARCH_EXTRACTOR_TYPE=tika
      - SEARCH_EXTRACTOR_TIKA_TIKA_URL=http://tika:9998
      - FRONTEND_FULL_TEXT_SEARCH_ENABLED=true
    volumes:
      - /mnt/owncloud-data/config:/etc/ocis
      - /mnt/owncloud-data/data:/var/lib/ocis
    depends_on:
      tika:
        condition: service_healthy
      nats:
        condition: service_started
    restart: unless-stopped
